name: Firmware CI

on:
  push:
    branches:
      - main
      - release/note-baseline-prod
      - validation/note4
      - refactor/ai-agent-tier
  pull_request:

permissions:
  contents: read

jobs:
  robustness:
    name: Robustness fault models, UI and semantic negative controls (not HIL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf:v5.5.6
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare pinned host schema validators
        working-directory: firmware/wqn-zectrix-note4
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 -m venv "$RUNNER_TEMP/robustness-venv"
          "$RUNNER_TEMP/robustness-venv/bin/python" -m pip install -r scripts/robustness-requirements.txt

      - name: Install independent native SHA oracle headers
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libssl-dev

      - name: Run mapped regressions and require semantic rejection of guard removals
        working-directory: firmware/wqn-zectrix-note4
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          "$RUNNER_TEMP/robustness-venv/bin/python" scripts/run_robustness_gate.py --selftest
          "$RUNNER_TEMP/robustness-venv/bin/python" scripts/run_robustness_gate.py --output-dir "$RUNNER_TEMP/robustness-results"

  diagnostic-evidence:
    name: Storage evidence attribution and diagnostic control configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject misleading log attribution, percentiles and config drift (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_storage_evidence.py

  audio-timeout:
    name: Audio channel timeout contract (100/1000 Hz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Exercise production I2S boundary and caller units
        run: python3 firmware/wqn-zectrix-note4/scripts/test_audio_channel_timeout.py

  rtc-timekeep:
    name: RTC, clock source, timer continuity and I2C (100/1000 Hz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Exercise RTC, SNTP callbacks, timer restore, lock and codec paths (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_rtc_timekeep.py

  wake-and-timer:
    name: Wake deadline, short waits and timer retention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Exercise production wake and hardware wait contracts (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_wake_deadline.py

      - name: Exercise production timer and RTC-retained state (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_time_retention.py

      - name: Check complete ADC batches and synchronous UI battery callers (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_power_sampling.py

  audio-codec:
    name: Complete codec configuration budget (100/1000 Hz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Exercise full production codec program and cleanup (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_audio_codec_budget.py

  button-input:
    name: GPIO capture, event ring, PTT release and final sleep gate (100/1000 Hz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Replay production sampling, consumers and sleep commit (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_button_input.py

  fault-diagnostics:
    name: RTC fault journal and storage failure context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Exercise production fault journal, torn writes and provenance (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_fault_diagnostics.py

      - name: Exercise production storage owner and typed failure context (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_audio_runtime.py

  storage-schema:
    name: Boot storage schema fault characterization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Exercise real boot schema decisions with host fault ports
        run: python3 firmware/wqn-zectrix-note4/scripts/test_storage_schema.py

      - name: Exercise production startup and journal recovery gates
        run: python3 firmware/wqn-zectrix-note4/scripts/test_sync_boot_recovery.py

      - name: Protect live pack temp files during capacity reclamation (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_storage_temp_lease.py

      - name: Exercise pack callbacks with C++ allocation denied after Begin (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_pack_stream_allocations.py

      - name: Exercise bounded pack-path ownership and task contention (not HIL)
        run: python3 firmware/wqn-zectrix-note4/scripts/test_pack_stream_path_lease.py

  contract:
    name: Architecture gate fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same cmake -P entry point the local flow uses; it needs no
      # ESP-IDF environment, only cmake.
      - name: Run M8 gate fixture tests
        run: |
          cmake \
            -DQN_REPO_DIR="$PWD/firmware/wqn-zectrix-note4" \
            -DQN_BUILD_DIR="$RUNNER_TEMP/m8-fixtures" \
            -P firmware/wqn-zectrix-note4/cmake/tests/run_gate_fixture.cmake

  hil-log:
    name: HIL log parser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run HIL checker selftests
        run: python3 firmware/wqn-zectrix-note4/scripts/hil_check.py --selftest

      - name: Run hil_check on the smoke fixture
        run: |
          python3 firmware/wqn-zectrix-note4/scripts/hil_check.py \
            firmware/wqn-zectrix-note4/scripts/testdata/hil_smoke.txt \
            > "$RUNNER_TEMP/hil.txt" 2>&1
          cat "$RUNNER_TEMP/hil.txt"

      # The fixture pins the parser; if one of these flips to SKIP/FAIL the
      # line formats or the regular expressions drifted.
      - name: Assert pinned criteria still pass
        run: |
          grep -q '\[PASS\] GATES:self-test-green' "$RUNNER_TEMP/hil.txt"
          grep -q '\[PASS\] P0-c5:word-domain-serialized' "$RUNNER_TEMP/hil.txt"
          grep -q '\[PASS\] P0-c5:note-domain-serialized' "$RUNNER_TEMP/hil.txt"
          grep -q '\[PASS\] C6b:reset-succeeded' "$RUNNER_TEMP/hil.txt"
          grep -q '\[PASS\] STAB:stack-hwm-healthy' "$RUNNER_TEMP/hil.txt"

  build:
    name: ESP-IDF build (esp32s3)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.6
    env:
      IDF_CCACHE_ENABLE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache ccache and managed components
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            firmware/wqn-zectrix-note4/managed_components
          key: idf-${{ hashFiles('firmware/wqn-zectrix-note4/dependencies.lock') }}
          restore-keys: |
            idf-

      - name: Outbox recovery host regressions (not HIL)
        working-directory: firmware/wqn-zectrix-note4
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 scripts/test_binary_outbox_recovery.py
          python3 scripts/test_problem_outbox_recovery.py
          python3 scripts/test_word_outbox_quota.py
          python3 scripts/test_problem_empty_cache.py
          python3 scripts/test_word_session_replay.py
          python3 scripts/test_pack_prune.py

      - name: Prepare host SHA-256 fixture dependency
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libssl-dev

      - name: Offline word segments, descriptors, paging and scope host regressions (not HIL)
        working-directory: firmware/wqn-zectrix-note4
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 scripts/test_word_local_sequence.py
          python3 scripts/test_word_local_descriptor.py
          python3 scripts/test_word_local_flow.py
          python3 scripts/test_word_offline_dispatch.py
          python3 scripts/test_word_longseq_api.py
          python3 scripts/test_word_longseq_codec.py
          python3 scripts/test_word_scope_autorepair.py
          python3 scripts/test_word_deck_scope_tail.py
          python3 scripts/test_word_session_start.py
          python3 scripts/test_word_ack_upload.py

      - name: SSE and voice endpoint host regressions (not HIL)
        working-directory: firmware/wqn-zectrix-note4
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 scripts/test_stream_transport.py
          python3 scripts/test_voice_endpoint.py

      - name: Integrated storage, STD and Flash host regressions (not HIL)
        working-directory: firmware/wqn-zectrix-note4
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 scripts/test_pack_stream_allocations.py
          python3 scripts/test_pack_stream_path_lease.py
          python3 scripts/test_pack_stream_profile.py
          python3 scripts/test_std_ai.py
          python3 scripts/test_std_stream.py
          python3 scripts/test_flash_uplink.py
          python3 scripts/test_audio_rx_overflow.py

      # wqn_architecture_check is an ALL target, so the M8 ownership gate runs
      # as part of the build.
      - name: Build
        working-directory: firmware/wqn-zectrix-note4
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          idf.py -B build-ci set-target esp32s3
          set -o pipefail
          idf.py -B build-ci -DWQN_BUILD_PROFILE=ai-local build 2>&1 | tee "$RUNNER_TEMP/firmware-build.log"
          if grep -qi 'warning:' "$RUNNER_TEMP/firmware-build.log"; then
            echo 'Firmware build emitted warnings'
            exit 1
          fi
          grep -q 'M8 architecture ownership gate passed' "$RUNNER_TEMP/firmware-build.log"
